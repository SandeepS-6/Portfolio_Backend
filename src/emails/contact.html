<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>{{headline}}</title>
  </head>
  <body style="margin:0;padding:0;background:#f3f4f6">
    <!-- Portfolio contact form notification -->
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background:#f3f4f6;padding:40px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="max-width:560px;background:#ffffff;border-radius:14px;overflow:hidden;border:1px solid #e5e7eb"
          >
            <tr>
              <td align="center" style="padding:40px 40px 16px">
                <div
                  style="display:inline-block;width:46px;height:46px;border-radius:10px;background:#f17a32;color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;line-height:46px;text-align:center;letter-spacing:0.5px"
                >
                  {{brandMark}}
                </div>
              </td>
            </tr>

            <tr>
              <td align="center" style="padding:4px 40px 0">
                <h1
                  style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700;line-height:1.3;color:#111827"
                >
                  {{headline}}
                </h1>
              </td>
            </tr>

            <tr>
              <td align="center" style="padding:12px 40px 28px">
                <p
                  style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;line-height:1.55;color:#6b7280"
                >
                  {{subheadline}}
                </p>
              </td>
            </tr>

            <tr>
              <td style="padding:0 40px 12px">
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px"
                >
                  <tr>
                    <td style="padding:20px 20px 6px">
                      <p
                        style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;line-height:1.4;letter-spacing:0.04em;text-transform:uppercase;color:#f17a32"
                      >
                        Message details
                      </p>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:4px 20px 18px">
                      <table
                        role="presentation"
                        width="100%"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                      >
                        {{detailsHtml}}
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td
                style="padding:8px 40px 28px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;line-height:1.7;color:#374151"
              >
                <p
                  style="margin:0 0 8px;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#6b7280"
                >
                  Message:
                </p>
                {{bodyHtml}}
              </td>
            </tr>

            {{ctaBlock}}

            <tr>
              <td
                align="center"
                style="padding:20px 40px;background:#f9fafb;border-top:1px solid #e5e7eb"
              >
                <p
                  style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:400;line-height:1.5;color:#9ca3af"
                >
                  &copy; {{year}} {{brandName}}
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
